project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - how-to.qmd
    - services.qmd
    - "songs/*.qmd"
    - "topics/*.qmd"
    - "services/*.qmd"

website:
  site-url: https://crpc-choir.github.io/choir-songbook/
  description: "Topic-by-topic songbook for the CRPC choir"
  image: images/share.png
  open-graph: true
  title: "CRPC Choir Songbook"          
  favicon: images/logo.png
  search:
    location: navbar
    type: overlay
  navbar:
    logo: images/logo.png
    left:
      - href: index.qmd
        text: All songs
      - href: topics/index.qmd
        text: Topics
      - href: services.qmd
        text: Service orders
      - href: how-to.qmd
        text: Adding songs
  page-footer:
    center: "© 2026 CRPC Choir · Created Sept, 2026 · For Internal Use Only · Developed by SoftData Consult"
format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: false